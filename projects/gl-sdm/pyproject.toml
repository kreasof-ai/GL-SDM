[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gl-sdm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.7", "triton>=3.3", "numpy", "einops", "transformers>=4.56", "datasets", "huggingface-hub", "ninja"]

[project.optional-dependencies]
test = ["pytest"]
urm = ["urm-kernel-lab @ git+https://github.com/kreasof-ai/urm.git@604bfdf5d2c827266a32ef142ca996cc712d70f0"]

[project.scripts]
gl-sdm = "gl_sdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
