[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urm-kernel-lab"
version = "0.1.0"
description = "Reference semantics and benchmark harness for the Unified Routed Mixer research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
dev = [
  # Pinned for reproducible formatting/lint results; ruff's output changes
  # across minor versions. Bump deliberately and re-run the format check.
  "ruff==0.16.4",
]
torch = [
  "torch>=2.7",
]
gpu = [
  "torch>=2.8",
  # Validated line: the routed-reduction backend capability-gates private
  # Triton APIs and falls back to the standard launcher when they are absent,
  # but steady-state numbers in docs/results were produced with this version.
  "triton>=3.4,<3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
