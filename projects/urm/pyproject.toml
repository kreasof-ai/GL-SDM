[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urm-kernel-lab"
version = "0.1.0"
description = "Reference semantics and benchmark harness for the Unified Routed Mixer research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
torch = [
  "torch>=2.7",
]
gpu = [
  "torch>=2.8",
  "triton>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
