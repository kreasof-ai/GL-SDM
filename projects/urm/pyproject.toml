[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urm-kernel-lab"
version = "0.1.0"
description = "Reference semantics and benchmark harness for the Unified Routed Mixer research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Compatible range: >=1.26,<3. The validated GPU line (and every committed
  # artifact) uses numpy 1.26.4; the CPU oracle also runs on numpy 2.x (see
  # docs/benchmarking.md "Dependency policy"). Both endpoints of the range are
  # exercised by clean-environment test runs before each release commit.
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  # Result-schema validation tests require jsonschema; declaring it here keeps
  # the non-GPU suite runnable in a clean environment without global packages.
  "jsonschema>=4.18",
]
dev = [
  # Pinned for reproducible formatting/lint results; ruff's output changes
  # across minor versions. Bump deliberately and re-run the format check.
  "ruff==0.16.4",
]
torch = [
  "torch>=2.7",
]
gpu = [
  "torch>=2.8",
  # Validated line: the routed-reduction backend capability-gates private
  # Triton APIs and falls back to the standard launcher when they are absent,
  # but steady-state numbers in docs/results were produced with this version.
  "triton>=3.4,<3.5",
]
fla = [
  # Pinned upstream for the gated delta-rule comparator
  # (docs/fla-gated-delta-rule.md). Bump deliberately: the frozen contract is
  # verified against this exact release.
  "flash-linear-attention==0.5.2",
]
solver = [
  # Optional compiler dependency for constraint feasibility/optimization
  # (docs/kernel-generation.md). Core URM functionality never requires it.
  # Pinned exactly: the validated line used by every committed solver
  # artifact; artifacts record the installed version alongside this pin.
  "z3-solver==4.15.3.0",
]

[tool.ruff.lint]
# Import order is part of the acceptance gates: `ruff check` must cover it.
extend-select = ["I"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
